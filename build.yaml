version: "1.0.17.0"
targetAbi: "12.1.0.0"
framework: "net10.0"
owner: "huzaim550"
overview: "Adds a rotating hero banner of the latest additions per library to the home screen."
description: >
  Hero Banner adds a large rotating banner to the top of the Jellyfin home screen,
  cycling through the most recently added item in each of your libraries with its
  backdrop image, title, and an optional overview blurb.
category: "General"
artifacts:
  - "Jellyfin.Plugin.HeroBanner.dll"
changelog: >
  - 1.0.17.0: Rebuild the banner as a full-bleed billboard. It runs edge to edge now - no side margins, no corner radius, no border and no shadow - and its bottom edge is masked away so the artwork dissolves into the page and the home rows below emerge from it instead of meeting a hard line. The title is the item's own logo artwork where there is one, and the name in text where there is not; episodes have no logo of their own, so they borrow the series logo. Logos are drawn in solid white, because the ClearLogo images Jellyfin sources are as often dark or coloured as they are white and a dark one is unreadable over the scrim. The slide indicators move from the bottom-right corner to the bottom-left, directly under the buttons, and now travel with the text block instead of being pinned to the banner's edge. Play and More info lose their outline, and the primary button keeps a 4px corner. The banner's own entrance is a plain fade rather than a 20px rise, since a full-width band sliding up reads as a card arriving rather than as a billboard. The resume bar sits at the top of the fade rather than on the bottom edge, which is where the banner now dissolves into the page. Nothing else changes: the content sources, the rotation, the cross-fade, the resume behaviour, the page-gutter alignment and the reduced-motion handling all work as before.
  - 1.0.16.0: Built against Jellyfin 12.1 (net10.0) instead of 10.9, so the plugin is loadable on 12.x. The banner is roughly a third taller, and the dark tint over the artwork is much lighter - the gradient now falls away so only the column the text sits in stays dark, which leaves the picture itself visible instead of crushed to near-black. The Play and More info buttons now link the way the 12.x web client routes; they used to emit the older "#!" URL form, which 12.x still redirects but warns about on every click and has said it will stop supporting. This release also carries the "What the banner shows" setting described below, which had not shipped yet.
  - 1.0.15.0: Add a "What the banner shows" setting with four content sources - recently added, continue watching, next up, and a random pick. Continue watching and next up follow the signed-in user rather than the library, so each person on the server now sees their own banner, and anything part-watched gets a resume bar along the bottom with a Resume button instead of Play. Note that the library include/exclude filters do not apply to those two sources, and that "How many titles will slide" counts per library for recently added and random, but as a total for the other two.
  - 1.0.14.0: Restyle the banner away from the generic look. The violet accent colour and the library-name badge above the title are gone, so the artwork is the only colour on screen. The title is set in Inter Tight at 600 instead of an 800-weight system font, the year/rating/runtime line is now small letterspaced credits (runtime reads 2h 9m rather than 129 min), and the buttons lose the pill shape, the blur and the glow. The corner radius drops from 20px to 12px and the text shadows are removed in favour of a scrim that carries legibility on its own. Inter and Inter Tight now ship inside the plugin and are served from /HeroBanner/fonts/, so the banner keeps its typography on a server with no internet access.
  - 1.0.13.0: Refresh the banner visually - artwork now cross-fades with a slow push-in, the library name sits in a badge, a year/rating/runtime/genre line appears under the title, the buttons carry icons, and the slide indicators fill up over the rotation interval. Adds narrow-screen and reduced-motion handling.
  - 1.0.12.0: Fix the settings page never loading its script (fields were empty and Save did nothing), keep the banner on the Home tab instead of leaking onto Favorites, bring the banner back after navigating away and home again, stop the rotation timer from being reset by unrelated DOM changes, hide the banner when no library matches the filters, and require a signed-in user for the settings endpoint.
  - 1.0.11.0: Guard the settings page and banner UI against missing dashboard APIs and empty slide state so configuration changes and home-page refreshes do not crash the page.
  - 1.0.6.0: Fix plugin settings persistence so values save correctly and remain populated in the dashboard form.
  - 1.0.5.0: Fix startup injection lifecycle issues and keep the plugin version metadata aligned across build and release files.
  - 1.0.4.0: Fix settings persistence, banner layout, mobile spacing, and plugin compatibility.
