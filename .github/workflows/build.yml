name: Build and release plugin

on:
  push:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read version from csproj
        id: version
        run: |
          VERSION=$(grep -oPm1 "(?<=<AssemblyVersion>)[^<]+" Jellyfin.Plugin.HeroBanner.csproj)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.HeroBanner.csproj

      - name: Publish
        run: dotnet publish Jellyfin.Plugin.HeroBanner.csproj -c Release -o out

      - name: Package plugin zip
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="herobanner_${VERSION}.zip"
          cd out
          zip "../$ZIP_NAME" Jellyfin.Plugin.HeroBanner.dll
          cd ..
          CHECKSUM=$(md5sum "$ZIP_NAME" | cut -d ' ' -f1)
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: ${{ steps.package.outputs.zip_name }}
          fail_on_unmatched_files: true

      - name: Update manifest.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHECKSUM="${{ steps.package.outputs.checksum }}"
          ZIP_NAME="${{ steps.package.outputs.zip_name }}"
          REPO="${{ github.repository }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SOURCE_URL="https://github.com/${REPO}/releases/download/v${VERSION}/${ZIP_NAME}"
          
          python3 << 'PYSCRIPT'
          import json
          
          VERSION = "$VERSION"
          CHECKSUM = "$CHECKSUM"
          SOURCE_URL = "$SOURCE_URL"
          TIMESTAMP = "$TIMESTAMP"
          OWNER = "${{ github.repository_owner }}"
          
          # Read existing manifest or create new one
          try:
              with open("manifest.json", "r") as f:
                  manifest = json.load(f)
          except:
              manifest = [{
                  "guid": "6f2e9f2a-6c3a-4a9a-9b7e-3a6a9e7c1d4f",
                  "name": "Hero Banner",
                  "description": "Adds a rotating hero banner of the latest additions per library to the home screen.",
                  "overview": "Adds a rotating hero banner of the latest additions per library to the home screen.",
                  "owner": OWNER,
                  "category": "General",
                  "imageUrl": "",
                  "versions": []
              }]
          
          # Ensure versions array exists
          if "versions" not in manifest[0]:
              manifest[0]["versions"] = []
          
          # Remove any existing entry for this version (avoid duplicates)
          manifest[0]["versions"] = [v for v in manifest[0]["versions"] if v["version"] != VERSION]
          
          # Add new version entry at the beginning (newest first)
          new_version = {
              "version": VERSION,
              "changelog": "Bug fixes and improvements for plugin settings persistence and banner layout.",
              "targetAbi": "10.9.11.0",
              "sourceUrl": SOURCE_URL,
              "checksum": CHECKSUM,
              "timestamp": TIMESTAMP
          }
          manifest[0]["versions"].insert(0, new_version)
          
          # Write back with pretty formatting
          with open("manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
          PYSCRIPT
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          SOURCE_URL: https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/${{ steps.package.outputs.zip_name }}
          TIMESTAMP: ${{ env.TIMESTAMP }}

      - name: Commit manifest.json back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --staged --quiet || git commit -m "Update manifest.json for v${{ steps.version.outputs.version }}"
          git push
