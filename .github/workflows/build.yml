name: Build and release plugin

on:
  push:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Read version from csproj
        id: version
        run: |
          VERSION=$(grep -oPm1 "(?<=<AssemblyVersion>)[^<]+" Jellyfin.Plugin.HeroBanner.csproj)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Restore
        run: dotnet restore Jellyfin.Plugin.HeroBanner.csproj

      - name: Publish
        run: dotnet publish Jellyfin.Plugin.HeroBanner.csproj -c Release -o out

      - name: Package plugin zip
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          ZIP_NAME="herobanner_${VERSION}.zip"
          cd out
          zip "../$ZIP_NAME" Jellyfin.Plugin.HeroBanner.dll
          cd ..
          CHECKSUM=$(md5sum "$ZIP_NAME" | cut -d ' ' -f1)
          echo "zip_name=$ZIP_NAME" >> "$GITHUB_OUTPUT"
          echo "checksum=$CHECKSUM" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          files: ${{ steps.package.outputs.zip_name }}
          fail_on_unmatched_files: true

      - name: Update manifest.json
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          CHECKSUM="${{ steps.package.outputs.checksum }}"
          ZIP_NAME="${{ steps.package.outputs.zip_name }}"
          REPO="${{ github.repository }}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          SOURCE_URL="https://github.com/${REPO}/releases/download/v${VERSION}/${ZIP_NAME}"

          export VERSION CHECKSUM SOURCE_URL TIMESTAMP

          python3 <<'PY'
          import json
          import os
          import re

          VERSION = os.environ["VERSION"]
          CHECKSUM = os.environ["CHECKSUM"]
          SOURCE_URL = os.environ["SOURCE_URL"]
          TIMESTAMP = os.environ["TIMESTAMP"]
          OWNER = os.environ.get("GITHUB_REPOSITORY_OWNER", "")

          try:
              with open("manifest.json", "r", encoding="utf-8") as f:
                  manifest = json.load(f)
          except Exception:
              manifest = [{
                  "guid": "6f2e9f2a-6c3a-4a9a-9b7e-3a6a9e7c1d4f",
                  "name": "Hero Banner",
                  "description": "Adds a rotating hero banner of the latest additions per library to the home screen.",
                  "overview": "Adds a rotating hero banner of the latest additions per library to the home screen.",
                  "owner": OWNER,
                  "category": "General",
                  "imageUrl": "",
                  "versions": []
              }]

          if "versions" not in manifest[0]:
              manifest[0]["versions"] = []

          manifest[0]["versions"] = [v for v in manifest[0]["versions"] if v["version"] != VERSION]

          def changelog_for(version):
              """The curated changelog for a release.

              Read from build.yaml, which is where the changelog is written by
              hand for each version. Hardcoding a generic line here used to
              overwrite it on every push, so the entry users see in
              Dashboard > Plugins never described the actual release.
              """
              try:
                  with open("build.yaml", "r", encoding="utf-8") as f:
                      text = f.read()
              except OSError:
                  text = ""

              # Entries look like "  - 1.0.12.0: text", and the YAML folded
              # scalar may wrap an entry across several lines.
              pattern = (
                  r"^\s*-\s*" + re.escape(version) +
                  r"\s*:\s*(.+?)(?=^\s*-\s*\d+\.\d+\.\d+\.\d+\s*:|\Z)"
              )
              match = re.search(pattern, text, re.MULTILINE | re.DOTALL)
              if match:
                  return " ".join(match.group(1).split())

              # Otherwise keep whatever this version already had, so re-running
              # the job never degrades an entry that is already published.
              for entry in manifest[0]["versions"]:
                  if entry.get("version") == version and entry.get("changelog"):
                      return entry["changelog"]

              return "Bug fixes and improvements."

          new_version = {
              "version": VERSION,
              "changelog": changelog_for(VERSION),
              "targetAbi": "10.9.11.0",
              "sourceUrl": SOURCE_URL,
              "checksum": CHECKSUM,
              "timestamp": TIMESTAMP
          }
          manifest[0]["versions"].insert(0, new_version)

          with open("manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CHECKSUM: ${{ steps.package.outputs.checksum }}
          SOURCE_URL: https://github.com/${{ github.repository }}/releases/download/v${{ steps.version.outputs.version }}/${{ steps.package.outputs.zip_name }}

      - name: Commit manifest.json back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json
          git diff --staged --quiet || git commit -m "Update manifest.json for v${{ steps.version.outputs.version }}"
          git push
